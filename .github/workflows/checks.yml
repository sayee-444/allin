# The checks of .githooks/pre-commit, for every pull request and push to main, so a clone
# without the hook cannot merge unchecked code. The runner's kernel has Landlock ABI 6, so the
# confinement tests run too; on an older one they skip themselves.
name: checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      UV_PROJECT_ENVIRONMENT: venv  # where basedpyright's config looks for it, as in a clone
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14"
      - run: uv sync --locked --extra dev
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run basedpyright
      - run: uv run pytest -q
