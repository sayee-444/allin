# AllIn's look from before Themes: the terminal's own background and text, the five colours
# of each line type by their terminal name, and the reasoning dimmed. Only the border changes:
# with "auto", each Session takes its own colour from a palette of twelve.

[font]
family = "Monospace"
size = 10

[colors]
user = "cyan"
reasoning = "magenta"
answer = "green"
info = "yellow"
error = "red"

[border]
style = "single"
color = "auto"

[window]
size = "180x40"

[glyphs]
set = "unicode"
