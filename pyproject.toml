[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "allin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "openai>=2"]

[project.optional-dependencies]
dev = ["pytest", "ruff", "basedpyright"]

[project.scripts]
allin = "allin.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
venvPath = "."
venv = "venv"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# ANN: every function says its types, and never `Any` in a signature; UP: today's typing syntax.
extend-select = ["ANN", "UP"]

[tool.ruff.lint.per-file-ignores]
# Test functions return nothing; basedpyright strict still checks their parameters.
"tests/**" = ["ANN201"]
