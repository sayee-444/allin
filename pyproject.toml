[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "allin"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pydantic>=2", "openai>=2"]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mutmut", "ruff", "basedpyright"]

[project.scripts]
allin = "allin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.basedpyright]
include = ["src", "tests", "scripts"]
typeCheckingMode = "strict"
venvPath = "."
venv = "venv"

[tool.ruff]
line-length = 100
# Throwaway prototypes (#99) answer a question for docs/research/ and are never imported by
# AllIn; they are deleted once the code they inform lands, so src/'s rules do not apply.
extend-exclude = ["prototypes"]

[tool.ruff.lint]
# Each family is chosen on purpose (#49); single rules left out, and why, are listed below.
extend-select = [
    "ANN",   # every function says its types; no `Any` in a signature
    "UP",    # today's syntax (PEP 604/695), never Optional/List/TypeVar
    "I",     # import order
    "B",     # bugbear: mutable defaults, loop variables caught in closures, unchained re-raises
    "C4",    # comprehensions over list()/dict() calls
    "PIE",   # needless pass, duplicate class fields
    "PERF",  # loops that build lists the slow way
    "FURB",  # modern standard-library idioms
    "SIM",   # simpler forms, e.g. contextlib.suppress over try/except/pass
    "RET",   # returns without a needless variable or else
    "RUF",   # ruff's own checks, among them unused `noqa`
    "PTH",   # pathlib over os.path and open(); paths are `Path` everywhere
    "T20",   # no print: everything goes to the Log
    "DTZ",   # datetimes always carry a timezone
    "ERA",   # no commented-out code
    "BLE",   # no `except Exception` that swallows the error without a `noqa` saying why
    "TRY",   # raise and re-raise patterns (tryceratops)
    "EM",    # exception messages are not inline literals
    "ARG",   # unused arguments
    "N",     # PEP 8 names
    "PT",    # pytest idioms
    "A",     # no shadowed builtins
    "S",     # bandit security checks
    "PLC",   # pylint conventions
    "PLE",   # pylint errors
    "PLW",   # pylint warnings
    "PGH",   # `# type: ignore` and `noqa` always name their rule
    "FLY",   # f-strings over "".join of a few literals
    "G",     # logging calls (none today; keeps any that come lazy)
    "LOG",   # logging module misuse
    "RSE",   # `raise` without needless parentheses
    "PYI",   # stub and typing idioms
    "SLF",   # no reaching into another object's private members
    "TID",   # tidy imports
]
ignore = [
    "N818",   # errors are named after what happened (TurnCancelled, SessionNotFound), not "...Error"
    "PT018",  # splitting `assert a and b` would rewrite the suite's asserts for no new check
    "A002",   # `input` mirrors the OpenAI parameter that Llm.stream wraps
    "S101",   # asserts state invariants for the type checker in src, and are the checks in tests
    "S603",   # the Launcher runs fixed commands built by Main, never shell text
    "S310",   # the Server watch opens Main's own base_url; isolation is decided in ADR-0016
]
# Families left out on purpose:
# - FBT: on/off flags read clearly at their call sites (`show_raw(on, ...)`, `InputLock(True)`),
#   and curses' API takes positional booleans (`keypad(True)`).
# - PLR (2004, 0913, 0917, 0912): magic numbers in tests read best literal, and the Dispatcher
#   takes its collaborators by design (#20); a count of arguments is no measure here.
# - D: docstrings are written where they say something the name does not, not on every function.
# - COM, Q, ISC: the formatter owns commas, quotes and string joins.
# - C90: complexity is judged in review (codebase-design), not by a number.

[tool.ruff.lint.per-file-ignores]
# Test functions return nothing; basedpyright strict still checks their parameters.
# Fakes keep the signatures they stand in for, and raise plain errors with their message.
"tests/**" = ["ANN201", "ARG", "TRY003", "EM101"]

[tool.mutmut]
# Mutation testing: `venv/bin/mutmut run`, then `venv/bin/mutmut results`. Start with the pure
# logic, where a surviving mutant means a test that would miss a real bug.
paths_to_mutate = [
    "src/allin/core/ids.py",
    "src/allin/core/drafts.py",
    "src/allin/main/slots.py",
    "src/allin/main/usage.py",
    "src/allin/main/prompts.py",
    "src/allin/supervisor/settings.py",
    "src/allin/main/link_changes.py",
    "src/allin/main/cut_turns.py",
    "src/allin/main/admission.py",
    "src/allin/main/context_notice.py",
    "src/allin/main/compaction.py",
]
tests_dir = ["tests/"]
also_copy = ["src/", "scripts/", "sysprompts/", ".githooks/", "functions/"]
